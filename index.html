<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14100e" media="(prefers-color-scheme: dark)" />
    <script>
      // Aplica el tema guardado (o el del sistema) antes de pintar para evitar el flash.
      (() => {
        try {
          const stored = localStorage.getItem('loveu_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch {
          // Si localStorage no está disponible, usamos el tema claro.
        }
      })();
    </script>
    <link rel="stylesheet" href="./src/index.css" />
    <title>Nuestra Nidito de Dos 💕</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
